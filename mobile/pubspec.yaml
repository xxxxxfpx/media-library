name: media_app
description: "Media Library mobile client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  flutter_lucide: ^1.8.2

  # HTTP Client
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Image loading
  cached_network_image: ^3.3.1

  # Video player
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.1.3
  media_kit_libs_ios_video: ^1.1.4

  # Local storage
  shared_preferences: ^2.2.3

  # Code generation
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # YAML config file parsing
  yaml: ^3.1.3

  # UI helpers
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3

  # Device info
  device_info_plus: ^10.1.0

  # URL handling
  url_launcher: ^6.2.6

  # Screen brightness control
  screen_brightness: ^0.2.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.yaml
