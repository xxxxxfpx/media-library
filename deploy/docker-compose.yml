# 单镜像部署：镜像内含 FastAPI + SPA 静态资源，服务器无需 Node/Gradle
# 使用前将 .env.example 复制为 .env 并填入敏感值，或在 docker compose 时显式传入
# 首次部署由 CI 自动生成 docker-compose.yml 与 .env，本地调试可直接使用本文件

services:
  media:
    image: ${IMAGE:-crpi-7r0bt0szn4xnpd8.cn-hangzhou.personal.cr.aliyuncs.com/xiemingzhe/media:latest}
    container_name: media-library
    restart: unless-stopped
    pull_policy: always
    # .env 可选：未创建时容器入口脚本会自动生成随机密钥
    env_file:
      - path: .env
        required: false
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config:ro
      - ${SECRETS_DIR:-./secrets}:/app/secrets:rw
      - ${DATA_DIR:-./data}:/app/data
    ports:
      - "${BACKEND_PORT:-1999}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
