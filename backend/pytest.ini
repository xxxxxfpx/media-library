[pytest]
# pytest 配置文件

# 异步测试模式
asyncio_mode = auto

# 测试发现路径
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py

# 测试类匹配模式
python_classes = Test*

# 测试函数匹配模式
python_functions = test_*

# 输出设置
addopts = -v --tb=short

# 标记
markers =
    asyncio: 异步测试标记
    integration: 集成测试标记
    unit: 单元测试标记