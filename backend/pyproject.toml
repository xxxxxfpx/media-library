[project]
name = "media-library-backend"
version = "1.0.0"
description = "媒体库管理系统后端 (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.24.0",
    "asyncpg>=0.28.0",
    "pydantic>=2.0.0",
    "diskcache>=5.6.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "asyncio: 异步测试标记",
    "integration: 集成测试标记",
    "unit: 单元测试标记",
]
