# Example secrets configuration.
# Copy this file to secrets/config.yaml and replace every placeholder locally.
# Do not use these values in production.

database:
  # PostgreSQL password. SQLite mode does not use this value.
  password: "<POSTGRES_PASSWORD>"

app:
  # Generate a long random value for signing JWTs.
  secret_key: "<GENERATE_A_LONG_RANDOM_SECRET>"
  admin:
    username: "<ADMIN_USERNAME>"
    password: "<ADMIN_PASSWORD>"

cloud_auth:
  # 123 Cloud WebDAV account.
  username: "<CLOUD_USERNAME>"
  password: "<CLOUD_PASSWORD>"

remote_database:
  # Remote PostgreSQL used by migration and verification scripts.
  host: "<REMOTE_DB_HOST>"
  port: 5432
  database: "<REMOTE_DB_NAME>"
  username: "<REMOTE_DB_USERNAME>"
  password: "<REMOTE_DB_PASSWORD>"
