name: Docker Deploy

'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 测试与构建校验：PR 和 push 都会执行 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest pytest-asyncio

      - name: Compile backend sources
        working-directory: backend
        run: python -m compileall -q app database tests config.py run.py

      - name: Run backend tests
        # 项目当前 pytest 基线有历史债务（约 37 failed / 48 passed），
        # 修复测试后应移除 continue-on-error，使其阻塞部署。
        working-directory: backend
        continue-on-error: true
        run: PYTHONPATH=. pytest tests/ -q -W default

      - name: Backend quality checks
        working-directory: backend
        continue-on-error: true
        run: |
          echo "── ruff ──"
          ruff check app database tests --statistics

      # ── 前端构建校验 ──
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ── Alembic 迁移验证（单轨） ──
      - name: Validate migrations
        working-directory: backend
        run: |
          export DB_PATH=$(mktemp /tmp/alembic-ci-XXXX.db)
          # 生成临时配置覆盖 sqlite_path，避免污染仓库默认测试库
          python - <<PY
          import os, yaml
          # 基于仓库内已提交的默认配置生成临时 CI 配置（env.yaml 为 gitignored 本地覆盖，CI 上不存在）
          with open('config/default.yaml') as f:
              cfg = yaml.safe_load(f)
          cfg['database']['sqlite_path'] = os.environ['DB_PATH']
          cfg['app']['secret_key'] = 'ci-secret'
          with open('.ci_alembic_env.yaml', 'w') as f:
              yaml.safe_dump(cfg, f)
          PY
          CONFIG_PATH=.ci_alembic_env.yaml PYTHONPATH=. alembic -c database/alembic.ini upgrade head
          CONFIG_PATH=.ci_alembic_env.yaml PYTHONPATH=. alembic -c database/alembic.ini current
          CONFIG_PATH=.ci_alembic_env.yaml PYTHONPATH=. python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("database/alembic.ini")
          heads = ScriptDirectory.from_config(cfg).get_heads()
          assert len(heads) == 1, heads
          print("OK: single alembic head =", heads[0])
          PY
          rm -f .ci_alembic_env.yaml

  # ── 生产部署：仅 push 到 main 或 workflow_dispatch 触发 ──
  deploy-on-server:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute frontend version
        id: version
        run: |
          V="v$(node -p "require('./frontend/package.json').version")-$(git rev-parse --short HEAD)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V"

      # 镜像在目标服务器上构建：只把源码打包传过去，节省 runner 资源并复用服务器缓存。
      - name: Package source
        run: |
          tar --exclude=.git \
              --exclude=frontend/node_modules \
              --exclude=frontend/dist \
              --exclude='*/__pycache__' \
              --exclude='*.pyc' \
              -czf media-library-src.tar.gz \
              backend frontend deploy
          ls -lh media-library-src.tar.gz

      - name: Transfer source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST || 'mz727.top' }}
          username: ${{ secrets.USERNAME || 'dev' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "media-library-src.tar.gz"
          target: "/tmp"

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST || 'mz727.top' }}
          username: ${{ secrets.USERNAME || 'dev' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            export DOCKER_BUILDKIT=1

            DEPLOY_DIR="/home/${{ secrets.USERNAME || 'dev' }}/media-library-deploy"
            rm -rf "$DEPLOY_DIR/build"
            mkdir -p "$DEPLOY_DIR/build"
            tar xzf /tmp/media-library-src.tar.gz -C "$DEPLOY_DIR/build"

            cd "$DEPLOY_DIR/build"

            # 构建后端镜像（build context 为 backend/，Dockerfile 在 deploy/）
            docker build \
              --build-arg APP_VERSION=${{ steps.version.outputs.tag }} \
              -f deploy/Dockerfile \
              -t media-library-backend:latest \
              backend

            # 构建前端产物（服务器需已安装 Node；使用国内镜像加速）
            cd "$DEPLOY_DIR/build/frontend"
            npm config set registry https://registry.npmmirror.com
            npm ci
            npm run build

            # 启动服务
            cd "$DEPLOY_DIR/build/deploy"

            # 持久化 secret_key：首次随机生成并保存在 build 目录之外，
            # 避免每次部署重建导致 secret_key 轮换、已有登录态失效
            SECRET_FILE="$DEPLOY_DIR/.media_secret_key"
            if [ ! -f "$SECRET_FILE" ]; then
              openssl rand -hex 32 > "$SECRET_FILE"
              chmod 600 "$SECRET_FILE"
            fi
            APP_SECRET_KEY="$(cat "$SECRET_FILE")"
            # 管理员密码：首次随机生成并持久化，避免空密码建号导致无法登录；
            # 可在服务器 $DEPLOY_DIR/.media_admin_password 查看
            ADMIN_PW_FILE="$DEPLOY_DIR/.media_admin_password"
            if [ ! -f "$ADMIN_PW_FILE" ]; then
              openssl rand -hex 12 > "$ADMIN_PW_FILE"
              chmod 600 "$ADMIN_PW_FILE"
            fi
            APP_ADMIN_PASSWORD="$(cat "$ADMIN_PW_FILE")"
            # secrets 持久目录放在 build 之外：容器以 root 写入，
            # 放 build 内会导致 rm -rf 重建时权限拒绝
            mkdir -p "$DEPLOY_DIR/secrets"
            # 写入 compose 运行时环境变量：入口脚本据此生成 secrets/config.yaml；
            # CORS 指向对外域名 media.mz727.top
            printf 'APP_SECRET_KEY=%s\nAPP_ADMIN_PASSWORD=%s\nCORS_ORIGINS=https://media.mz727.top\nSECRETS_DIR=%s\n' \
              "$APP_SECRET_KEY" "$APP_ADMIN_PASSWORD" "$DEPLOY_DIR/secrets" > .env

            docker compose down --remove-orphans
            docker compose up -d

            # 健康检查
            for i in $(seq 1 10); do
              if curl -fsS --max-time 3 http://127.0.0.1:1999/health; then
                echo "health check ok after ${i} attempts"
                exit 0
              fi
              echo "attempt $i: service starting, retrying in 3s..."
              sleep 3
            done
            docker ps --filter name=media-library-backend --format '{{.Status}}'
            echo "health check failed after 10 attempts"
            exit 1
