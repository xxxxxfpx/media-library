name: Docker Deploy

'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: crpi-7r0bt0szn4xpndx8.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: xiemingzhe/media

jobs:
  # ── 测试校验：PR 和 push 都会执行 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff pytest pytest-asyncio

      - name: Compile backend sources
        working-directory: backend
        run: python -m compileall -q app database tests config.py run.py

      - name: Run backend tests
        # 项目当前 pytest 基线有历史债务，continue-on-error 待后续清理后移除
        working-directory: backend
        continue-on-error: true
        run: PYTHONPATH=. pytest tests/ -q -W default

      - name: Backend quality checks
        working-directory: backend
        continue-on-error: true
        run: ruff check app database tests --statistics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate migrations
        working-directory: backend
        run: |
          export DB_PATH=$(mktemp /tmp/alembic-ci-XXXX.db)
          python - <<PY
          import os, yaml
          with open('config/default.yaml') as f:
              cfg = yaml.safe_load(f)
          cfg['database']['sqlite_path'] = os.environ['DB_PATH']
          cfg['app']['secret_key'] = 'ci-secret'
          with open('.ci_alembic_env.yaml', 'w') as f:
              yaml.safe_dump(cfg, f)
          PY
          CONFIG_PATH=.ci_alembic_env.yaml PYTHONPATH=. alembic -c database/alembic.ini upgrade head
          CONFIG_PATH=.ci_alembic_env.yaml PYTHONPATH=. alembic -c database/alembic.ini current
          CONFIG_PATH=.ci_alembic_env.yaml PYTHONPATH=. python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("database/alembic.ini")
          heads = ScriptDirectory.from_config(cfg).get_heads()
          assert len(heads) == 1, heads
          print("OK: single alembic head =", heads[0])
          PY
          rm -f .ci_alembic_env.yaml

  # ── 构建并推镜像 + 服务器部署：仅 main 分支 push 或手动触发 ──
  build-and-deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 计算版本标签 ──
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v$(node -p "require('./frontend/package.json').version")-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${REGISTRY}/${IMAGE_NAME}:${VERSION},${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      # ── 登录阿里云镜像仓库 ──
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 启用 docker-container buildx（支持 gha 缓存导出） ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 构建并推镜像（单镜像：FastAPI + SPA 静态资源） ──
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # 阿里云 ACR 个人版不支持 OCI provenance/sbom 附件，需关闭
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SSH 服务器：拉新镜像 + compose up ──
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail

            DEPLOY_DIR="/home/${{ secrets.USERNAME }}/media-library-deploy"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # 登录阿里云镜像仓库（docker 会复用凭据，无需每次重新登录）
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
              -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 确保必要目录存在
            mkdir -p config secrets data

            # docker-compose.yml 必须存在（本地仓库 deploy/ 目录下有模板）
            if [ ! -f "docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml 不存在"
              echo "      首次部署需手动拷贝：cp /path/to/repo/deploy/docker-compose.yml ./"
              exit 1
            fi

            # 拉取最新镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # 重建容器（容器入口脚本会自动处理 APP_SECRET_KEY / APP_ADMIN_PASSWORD 兜底）
            docker compose up -d --remove-orphans

            # 健康检查
            for i in $(seq 1 10); do
              if curl -fsS --max-time 3 http://127.0.0.1:1999/health; then
                echo "health check ok after ${i} attempts"
                exit 0
              fi
              echo "attempt $i: service starting, retrying in 3s..."
              sleep 3
            done
            docker ps --filter name=media-library --format '{{.Status}}'
            echo "health check failed after 10 attempts"
            exit 1
